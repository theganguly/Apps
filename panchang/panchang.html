<!doctype html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6efe3">
<title>હરિલાલ પંચાંગ — Shubh Panchang</title>
<style>
/* Harilal Panchang — hand-written stylesheet (no Tailwind, no external fonts, fully offline) */
:root {
  --paper: #f6efe3; --paper2: #efe6d3; --paper3: #e7dcc4;
  --ink: #221a12; --inksoft: #5c5142; --line: #ddd0b8; --frame: #c9bb9c; --input: #cfc3a8;
  --sindoor: #b81e2b; --saffron: #e07b24; --shubh: #1e6b3c;
  --rose: #f7e3e1; --sand: #faecda;
  --font: 'Noto Sans Gujarati', 'Hind Vadodara', 'Nirmala UI', 'Shruti', 'Gujarati Sangam MN', 'Lohit Gujarati', 'Mukta Vaani', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --display: 'Shrikhand', 'Noto Sans Gujarati', 'Hind Vadodara', 'Nirmala UI', 'Shruti', 'Gujarati Sangam MN', Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { font-family: var(--font); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; line-height: 1.5; }
body {
  margin: 0; color: var(--ink); background-color: var(--paper);
  background-image: radial-gradient(1200px 500px at 50% -10%, rgba(224,123,36,.06), transparent 70%);
  background-repeat: no-repeat;
}
h1, h2, h3, p, ul, table { margin: 0; padding: 0; }
ul { list-style: none; }
button, select, input { font: inherit; color: inherit; margin: 0; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg { display: block; }
.tnum { font-variant-numeric: tabular-nums; }
.display { font-family: var(--display); font-weight: 400; }

#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.wrap { max-width: 64rem; margin: 0 auto; padding: 0 .75rem; width: 100%; }

/* header */
.hdr { position: sticky; top: 0; z-index: 20; background: rgba(246,239,227,.95); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 2px solid var(--ink); padding-top: env(safe-area-inset-top); }
.hdr-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .625rem 0; }
.hdr h1 { font-size: 20px; line-height: 1; color: var(--sindoor); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .tag { display: none; font-size: 11.5px; color: var(--inksoft); margin-top: 2px; }
.hdr-l { min-width: 0; }
.hdr-r { display: flex; align-items: center; gap: 6px; }
.sel-wrap { position: relative; }
.sel-wrap svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--inksoft); pointer-events: none; }
.sel-wrap select { min-height: 44px; appearance: none; -webkit-appearance: none; border-radius: 6px; border: 1px solid var(--line); background: var(--paper2); padding: 0 8px 0 28px; font-size: 12.5px; font-weight: 500; max-width: 110px; }
.btn-sq { min-height: 44px; min-width: 44px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper2); color: var(--inksoft); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.btn-sq.on { border-color: var(--sindoor); background: var(--rose); color: var(--sindoor); }
.btn-lang { min-height: 44px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper2); padding: 0 10px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.btn-lang svg { width: 16px; height: 16px; }
.topnav { display: none; gap: 4px; margin-bottom: -1px; overflow-x: auto; scrollbar-width: none; }
.topnav::-webkit-scrollbar { display: none; }
.topnav button { flex: 0 0 auto; white-space: nowrap; min-height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--inksoft); }
.topnav button:hover { color: var(--ink); }
.topnav button.on { border-bottom-color: var(--sindoor); color: var(--sindoor); }
.topnav svg { width: 16px; height: 16px; }

main { flex: 1; width: 100%; max-width: 64rem; margin: 0 auto; padding: 1rem .75rem 6rem; }
.stack > * + * { margin-top: 1rem; }

/* bottom nav (mobile) */
.botnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 2px solid var(--ink); padding-bottom: max(env(safe-area-inset-bottom), .5rem); box-shadow: 0 -4px 18px rgba(34,26,18,.08); }
.botnav-grid { display: flex; overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
.botnav-grid::-webkit-scrollbar { display: none; width: 0; height: 0; }
.botnav-grid:focus-visible { outline: 2px solid var(--saffron); outline-offset: -2px; }
.botnav::before, .botnav::after { content: ''; position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 1; }
.botnav::after { right: 0; background: linear-gradient(to left, var(--paper) 15%, rgba(246,239,227,0)); }
.botnav::before { left: 0; background: linear-gradient(to right, var(--paper) 15%, rgba(246,239,227,0)); }
.botnav.more::after, .botnav.less::before { opacity: 1; }
.botnav button { flex: 0 0 auto; min-width: 72px; padding: 0 6px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 10px; font-weight: 600; color: var(--inksoft); white-space: nowrap; }
.botnav button.on { color: var(--sindoor); }
.botnav svg { width: 20px; height: 20px; }
.botnav button.on svg { stroke-width: 2.4; }

/* frames */
.frame-double { border: 2px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 3px; background: #fbf7ec; border-radius: 4px; }
.frame-thin { border: 1px solid var(--frame); background: #fbf7ec; border-radius: 4px; }
.pad { padding: .5rem 1rem; }
.pad-3 { padding: .75rem 1rem; }
.pad-sm { padding: .5rem .75rem; }
.hair { border-color: var(--line); }

/* common pieces */
.navrow { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.navbtn { min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid var(--line); background: var(--paper2); }
.navbtn:active { background: var(--paper3); }
.navbtn svg { width: 20px; height: 20px; }
.todaybtn { min-height: 44px; padding: 0 1rem; border-radius: 6px; border: 1px solid transparent; font-size: 14px; font-weight: 600; color: var(--inksoft); }
.todaybtn.off { border-color: var(--sindoor); color: var(--sindoor); background: var(--rose); }

.sect { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; margin: 4px 0 8px; }
.sect h2 { font-size: 15px; font-weight: 600; letter-spacing: .025em; color: var(--inksoft); display: flex; align-items: center; gap: 8px; }
.sect h2 i { display: inline-block; height: 2px; width: 20px; background: var(--sindoor); transform: translateY(-2px); }

.row { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; padding: 7px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .l { font-size: 14px; color: var(--inksoft); flex-shrink: 0; }
.row .v { font-size: 15px; font-weight: 500; text-align: right; line-height: 1.375; }
.row .v small { display: block; font-size: 12px; font-weight: 400; color: var(--inksoft); }
.row.red .v { color: var(--sindoor); }

.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper2); color: var(--ink); padding: 3px 10px; font-size: 12.5px; font-weight: 500; line-height: 1; }
.chip.good { background: #e5efe4; color: var(--shubh); border-color: #bcd6bd; }
.chip.bad { background: #f7e3e1; color: var(--sindoor); border-color: #e5b8b4; }
.chip.saffron { background: #faecda; color: #9a5511; border-color: #eccf9f; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.grid2 { display: grid; gap: .75rem; }
.suncards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.suncard { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.suncard svg { width: 16px; height: 16px; color: var(--saffron); flex-shrink: 0; }
.suncard .k { font-size: 11.5px; color: var(--inksoft); line-height: 1; }
.suncard .n { font-size: 17px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }

.masthead { padding: 1rem; text-align: center; }
.masthead .d1 { font-size: 13px; letter-spacing: .025em; color: var(--inksoft); }
.masthead h1 { font-size: 30px; line-height: 1.25; margin-top: 4px; font-weight: 400; }
.masthead h1.sun { color: var(--sindoor); }
.masthead .meta { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 12px; font-size: 13px; color: var(--inksoft); }
.masthead .meta2 { margin-top: 4px; font-size: 13px; color: var(--inksoft); }
.masthead b { color: var(--ink); font-weight: 600; }
.sep { color: var(--line); }

.festbox { padding: .75rem 1rem; border-left: 4px solid var(--sindoor); }
.festbox li { font-size: 15px; line-height: 1.375; }
.festbox li + li { margin-top: 4px; }
.festbox .nm { font-weight: 600; }
.festbox .nm.major { color: var(--sindoor); }
.note { color: var(--inksoft); font-size: 13px; }
.foot { text-align: center; font-size: 11.5px; color: rgba(92,81,66,.7); padding-top: 4px; }

/* tables */
.ruled { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.ruled th, .ruled td { border-bottom: 1px solid var(--line); padding: .45rem .6rem; text-align: left; }
.ruled th { font-weight: 600; color: var(--inksoft); font-size: .78rem; letter-spacing: .02em; }
.ruled tr:last-child td { border-bottom: 0; }
.ruled .r { text-align: right; }
.ruled tr.now { background: var(--sand); }
.good-t { color: var(--shubh); } .bad-t { color: var(--sindoor); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.dot.g { background: var(--shubh); } .dot.b { background: var(--sindoor); }
.nowtag { margin-left: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--saffron); }
.linkbtn { font-size: 12.5px; color: var(--sindoor); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; min-height: 32px; }

/* calendar */
.cal-title { font-size: 22px; text-align: center; font-weight: 400; }
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--paper2); border-bottom: 1px solid var(--line); }
.cal-head div { text-align: center; font-size: 11px; font-weight: 600; padding: 8px 0; }
.cal-head div.s { color: var(--sindoor); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cell { position: relative; text-align: left; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-height: 64px; padding: 4px; vertical-align: top; display: block; width: 100%; }
.cell.empty { background: rgba(239,230,211,.4); }
.cell:not(.empty):active { background: var(--paper3); }
.cell.pk { background: #f3ece0; }
.cell.td { background: var(--sand); }
.cell .top { display: flex; align-items: flex-start; justify-content: space-between; }
.cell .dn { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 999px; }
.cell .dn.sun { color: var(--sindoor); }
.cell .dn.today { background: var(--sindoor); color: var(--paper); padding: 0 4px; }
.cell .tt { font-size: 10px; color: var(--inksoft); font-variant-numeric: tabular-nums; }
.cell .fe { margin-top: 2px; font-size: 9.5px; line-height: 1.25; color: var(--inksoft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cell .fe.major { color: var(--sindoor); font-weight: 600; }
.cell .mn { margin-top: 2px; font-size: 9px; color: rgba(92,81,66,.7); }
.legend { font-size: 11.5px; color: var(--inksoft); margin-top: 8px; padding: 0 4px; }

/* festivals */
.fest-title { font-size: 20px; text-align: center; font-weight: 400; }
.dayrow { display: flex; gap: .75rem; padding: 10px 1rem; border-bottom: 1px solid var(--line); }
.dayrow:last-child { border-bottom: 0; }
.dayrow .dd { flex-shrink: 0; width: 52px; text-align: center; }
.dayrow .dd b { display: block; font-size: 17px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.dayrow .dd b.sun { color: var(--sindoor); }
.dayrow .dd span { font-size: 10.5px; color: var(--inksoft); }
.dayrow .ff { min-width: 0; flex: 1; font-size: 14px; line-height: 1.375; }
.dayrow .ff .major { font-weight: 600; color: var(--sindoor); }
.dayrow .ff .vrat { font-weight: 500; }
.dayrow .ff .other { color: var(--inksoft); }
.dayrow .ff small { font-size: 12px; color: var(--inksoft); }
.two { display: grid; gap: 0 1.5rem; }
.sk { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 8px; }
.sk span:first-child { font-weight: 500; }
.sk span:last-child { color: var(--inksoft); font-variant-numeric: tabular-nums; text-align: right; }
.ecl { padding: 7px 0; border-bottom: 1px solid var(--line); }
.ecl:last-child { border-bottom: 0; }
.ecl .a { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ecl .a b { font-size: 14.5px; font-weight: 600; }
.ecl .a span { font-size: 13px; color: var(--inksoft); font-variant-numeric: tabular-nums; }
.ecl .b { font-size: 12.5px; color: var(--inksoft); }

/* hora */
.horagrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 1rem; }
.horai { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.horai.now { background: var(--sand); margin: 0 -4px; padding: 6px 4px; }
.horai b { font-weight: 500; } .horai b.g { color: var(--shubh); }
.horai span { color: var(--inksoft); font-variant-numeric: tabular-nums; }
.mhead { text-align: center; }
.mhead .display { font-size: 20px; }

/* planets / kundali */
.rbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.rbtn { min-height: 44px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper2); font-size: 13px; font-weight: 500; padding: 0 4px; }
.rbtn.on { border-color: var(--sindoor); background: var(--rose); color: var(--sindoor); font-weight: 600; }
.lbl { display: block; font-size: 13px; color: var(--inksoft); margin-bottom: 6px; }
.ingrow { display: flex; align-items: baseline; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.ingrow:last-child { border-bottom: 0; }
.ingrow.past { opacity: .55; }
.ingrow span:last-child { color: var(--inksoft); font-variant-numeric: tabular-nums; }
.ingh { font-size: 13px; font-weight: 600; color: var(--inksoft); margin-bottom: 2px; }
.ing-block { margin-bottom: 12px; } .ing-block:last-child { margin-bottom: 0; }
.panoti-txt { font-size: 14px; line-height: 1.625; }
.inp { min-height: 44px; width: 100%; border-radius: 6px; border: 1px solid var(--input); background: #fbf7ec; padding: 0 12px; font-size: 15px; color: var(--ink); }
.form3 { display: grid; gap: 12px; }
.castbtn { margin-top: 12px; min-height: 44px; width: 100%; border-radius: 6px; background: var(--sindoor); color: var(--paper); font-weight: 600; font-size: 15px; }
.castbtn:active { opacity: .9; }
.chartbox svg { width: 100%; max-width: 340px; margin: 0 auto; user-select: none; }
.dasha { border-bottom: 1px solid var(--line); }
.dasha:last-child { border-bottom: 0; }
.dasha.cur { background: var(--sand); margin: 0 -8px; padding: 0 8px; border-radius: 4px; }
.dasha > button { width: 100%; display: flex; align-items: baseline; justify-content: space-between; padding: 10px 0; min-height: 44px; text-align: left; gap: 8px; }
.dasha > button b { font-size: 14.5px; font-weight: 600; }
.dasha > button span.dt { font-size: 12.5px; color: var(--inksoft); font-variant-numeric: tabular-nums; }
.antars { padding: 0 0 8px 12px; }
.antar { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 0; font-size: 13px; gap: 8px; }
.antar.now { font-weight: 600; color: var(--saffron); }
.antar span:last-child { color: var(--inksoft); font-variant-numeric: tabular-nums; }
.antar.now span:last-child { color: var(--saffron); }
.empty-note { padding: 1rem; font-size: 14px; color: var(--inksoft); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--frame); border-radius: 8px; border: 2px solid var(--paper); }
::-webkit-scrollbar-track { background: transparent; }

/* sm ≥ 640 */
@media (min-width: 640px) {
  .wrap, main { padding-left: 1.25rem; padding-right: 1.25rem; }
  .hdr h1 { font-size: 24px; }
  .hdr .tag { display: block; }
  .hdr-r { gap: 8px; }
  .sel-wrap select { min-height: 36px; font-size: 13px; max-width: none; }
  .btn-sq { min-height: 36px; min-width: 36px; }
  .btn-lang { min-height: 36px; font-size: 13px; }
  .masthead h1 { font-size: 36px; }
  .suncards { grid-template-columns: repeat(4, 1fr); }
  .cal-title { font-size: 26px; }
  .cal-head div { font-size: 12.5px; }
  .cell { min-height: 86px; padding: 6px; }
  .cell .dn { font-size: 15px; }
  .cell .tt { font-size: 11px; }
  .cell .fe { font-size: 11px; }
  .fest-title { font-size: 24px; }
  .two, .grid2s { grid-template-columns: 1fr 1fr; }
  .horagrid { grid-template-columns: repeat(3, 1fr); }
  .rbtns { grid-template-columns: repeat(6, 1fr); }
  .form3 { grid-template-columns: repeat(3, 1fr); }
  .castbtn { width: auto; padding: 0 2rem; }
}
/* md ≥ 768 */
@media (min-width: 768px) {
  .topnav { display: flex; }
  .botnav { display: none; }
  main { padding-bottom: 2rem; }
  .grid2 { grid-template-columns: 1fr 1fr; }
}
@media print { .hdr, .botnav, .sheet-ov { display: none; } }

/* ---------- header additions */
.btn-place { min-height: 44px; max-width: 120px; display: flex; align-items: center; gap: 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper2); padding: 0 8px; font-size: 12.5px; font-weight: 500; }
.btn-place svg { width: 14px; height: 14px; color: var(--inksoft); flex-shrink: 0; }
.btn-place span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-sq svg { width: 18px; height: 18px; }
@media (min-width: 640px) { .btn-place { min-height: 36px; font-size: 13px; max-width: 180px; } }
@media (max-width: 420px) { .hdr-r { gap: 4px; } .btn-place { max-width: 84px; padding: 0 6px; } .btn-lang { padding: 0 8px; } }

/* ---------- glossary terms */
.term { cursor: pointer; text-decoration: underline dotted; text-decoration-color: rgba(92,81,66,.55); text-underline-offset: 3px; text-decoration-thickness: 1px; border-radius: 2px; }
.term:hover { text-decoration-color: var(--sindoor); background: rgba(224,123,36,.08); }
.term:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.chip .term, .row.red .term { text-decoration-color: currentColor; }

/* ---------- sheet / modal */
html.sheet-lock, html.sheet-lock body { overflow: hidden; }
.sheet-ov { position: fixed; inset: 0; z-index: 50; background: rgba(34,26,18,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 38rem; max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column; border-radius: 14px 14px 0 0; margin: 0 0 0; outline-offset: -7px; background: #fbf7ec; animation: sheetup .18s ease-out; }
.sheet.wide { max-width: 44rem; }
@keyframes sheetup { from { transform: translateY(24px); } to { transform: none; } }
.sheet-hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
.sheet-ttl { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.sheet-ttl h2 { font-size: 20px; line-height: 1.3; color: var(--sindoor); }
.sheet-x { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid var(--line); background: var(--paper2); }
.sheet-x svg { width: 18px; height: 18px; }
.sheet-body { overflow-y: auto; padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.gsec { margin-bottom: 12px; }
.gsec h3 { font-size: 13px; font-weight: 700; letter-spacing: .03em; color: var(--inksoft); margin-bottom: 3px; display: flex; align-items: center; gap: 8px; }
.gsec h3::before { content: ''; width: 14px; height: 2px; background: var(--sindoor); }
.gsec p { font-size: 14.5px; line-height: 1.65; }
.gsec ul.why { padding-left: 18px; list-style: disc; font-size: 14px; line-height: 1.6; }
.chip.rel { cursor: pointer; min-height: 32px; }
.chip.rel:hover { border-color: var(--sindoor); }
@media (min-width: 640px) {
  .sheet-ov { align-items: center; }
  .sheet { border-radius: 4px; max-height: 84vh; }
}

/* ---------- place picker + map */
.psearch { position: relative; margin-bottom: 8px; }
.psearch svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--inksoft); }
.psearch .inp { padding-left: 34px; }
.plist { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.plabel { font-size: 12px; font-weight: 700; color: var(--inksoft); letter-spacing: .04em; padding: 6px 8px 2px; }
.prow { display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.prow.sel { background: var(--sand); }
.pmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 44px; text-align: left; }
.pmain svg { width: 14px; height: 14px; color: var(--saffron); flex-shrink: 0; }
.pmain .pn { font-weight: 500; font-size: 14.5px; }
.pmain small { color: var(--inksoft); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.navbtn.sm { min-height: 40px; min-width: 40px; padding: 0 6px; font-size: 12px; font-weight: 600; }
.navbtn.sm svg { width: 16px; height: 16px; }
.navbtn.sm.on { background: #e5efe4; border-color: #bcd6bd; color: var(--shubh); }
.navbtn.sm.danger { background: var(--rose); border-color: #e5b8b4; color: var(--sindoor); }
.locbtn { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 8px; }
.locbtn svg { width: 14px; height: 14px; }
.pform { margin-bottom: 8px; }
.pform .inp { font-variant-numeric: tabular-nums; }
.formmsg { min-height: 20px; font-size: 13px; margin-top: 6px; }
.mapbox { margin: 8px 0; }
.maptools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 500; background: var(--paper2); }
.seg button.on { background: var(--rose); color: var(--sindoor); font-weight: 700; }
.mapstatus { font-size: 12px; color: var(--inksoft); margin: 4px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.mapsvg { width: 100%; height: auto; max-height: 360px; border: 1px solid var(--frame); border-radius: 4px; touch-action: none; cursor: crosshair; background: var(--paper2); user-select: none; }
.mapattr { font-size: 10px; color: var(--inksoft); text-align: right; }
.maphint { font-size: 12px; color: var(--inksoft); line-height: 1.5; margin-top: 4px; }

/* ---------- tab manager */
.tablist { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.trow { display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-bottom: 1px solid var(--line); cursor: grab; }
.trow:last-child { border-bottom: 0; }
.trow.off { opacity: .55; }
.tchk { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14.5px; cursor: pointer; }
.tchk input { width: 20px; height: 20px; accent-color: var(--sindoor); }
.tchk svg { width: 16px; height: 16px; color: var(--inksoft); }
.tchk small { color: var(--inksoft); }
.navbtn:disabled { opacity: .35; cursor: default; }

/* ---------- planner / samvat */
.chip.tgl { cursor: pointer; min-height: 36px; padding: 0 12px; font-size: 13px; }
.chip.tgl.on { background: var(--rose); border-color: var(--sindoor); color: var(--sindoor); font-weight: 700; }
.fgrid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
.fsel span { display: block; font-size: 12px; color: var(--inksoft); margin-bottom: 3px; }
@media (min-width: 640px) { .fgrid { grid-template-columns: repeat(3, 1fr); } }
.mdate { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 8px 12px; background: var(--paper2); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--inksoft); }
.mdate b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; } .mdate b.sun { color: var(--sindoor); }
.mrow, .planitem { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px; border-bottom: 1px solid var(--line); }
.mmain { flex: 1; min-width: 0; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 8px 8px; align-items: baseline; }
.mmain .mt { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mmain .ml { font-size: 14px; }
.mmain .mq { grid-column: 1 / -1; font-size: 12px; color: var(--inksoft); }
.mmain:hover { background: rgba(224,123,36,.06); }
.planlist { max-height: 180px; overflow-y: auto; }
.expta { min-height: 240px; padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; resize: vertical; }
.adhik { color: var(--saffron); font-size: 11px; }
.plugin-view { padding: .25rem 0; }

</style>
